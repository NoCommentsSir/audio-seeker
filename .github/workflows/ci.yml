name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'back/**'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: .
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD_HASH: ""
          MINIO_API_PORT: 9000
          MINIO_PORT: 9001
          MINIO_USER: test
          MINIO_PASSWORD: test
          MINIO_HOST: localhost
          MINIO_BUCKET_NAME: track-list
        run: pytest back/test/unit/test_api.py

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: .
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
  
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run build

  sonarqube:
    name: SonarQube code analysing
    runs-on: self-hosted
    needs: frontend-build

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pytest pytest-cov

      - name: Generate backend coverage
        env:
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD_HASH: ""
          MINIO_API_PORT: 9000
          MINIO_PORT: 9001
          MINIO_USER: test
          MINIO_PASSWORD: test
          MINIO_HOST: localhost
          MINIO_BUCKET_NAME: track-list
        run: |
          .\.venv\Scripts\python.exe -m pytest --cov=back --cov-report=xml:back/coverage.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run SonarQube scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner `
            "-Dsonar.host.url=http://localhost:9500" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.projectVersion=${{ github.run_number }}" `
            "-Dsonar.analysis.buildNumber=${{ github.run_number }}" `
            "-Dsonar.analysis.commit=${{ github.sha }}"
            
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [sonarqube, changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Docker registry login
      uses: yc-actions/yc-cr-login@v3
      with: 
        yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS}}

    - name: Build Docker backend image
      if: needs.changes.outputs.backend == 'true'
      run: |
        docker build \
         -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/audio-seeker-backend:lab3 \
         -f back/Dockerfile \
         .

    - name: Push Docker backend image
      if: needs.changes.outputs.backend == 'true'
      run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/audio-seeker-backend:lab3

    - name: Build Docker frontend image
      if: needs.changes.outputs.frontend == 'true'
      run: |
        docker build \
         -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/audio-seeker-frontend:lab3 \
         -f frontend/Dockerfile \
         frontend

    - name: Push Docker frontend image
      if: needs.changes.outputs.frontend == 'true'
      run: docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/audio-seeker-frontend:lab3

  notify:
    name: Telgram ci status bot
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-build, frontend-tests, frontend-build, sonarqube, docker-build]
    if: always()

    steps:
      - name: Send Telegram notification about CI status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          BACKEND_BUILD: ${{ needs.backend-build.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          SONARQUBE_CHECKER: ${{ needs.sonarqube.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Status of CI for $REPO on branch $BRANCH%0A"
          MESSAGE="${MESSAGE}Commit: $COMMIT%0A%0A"
          MESSAGE="${MESSAGE}Backend tests: $BACKEND_TESTS%0A"
          MESSAGE="${MESSAGE}Backend build: $BACKEND_BUILD%0A"
          MESSAGE="${MESSAGE}Frontend tests: $FRONTEND_TESTS%0A"
          MESSAGE="${MESSAGE}Frontend build: $FRONTEND_BUILD%0A"
          MESSAGE="${MESSAGE}SonarQube checker: $SONARQUBE_CHECKER%0A"
          MESSAGE="${MESSAGE}Docker build: $DOCKER_BUILD%0A"
          MESSAGE="${MESSAGE}See details: $RUN_URL"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}&text=$MESSAGE"



