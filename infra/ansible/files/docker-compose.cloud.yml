version: '3.8'

services:
  lab-pg-db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DB}
    volumes:
      - lab_pg_data:/var/lib/postgresql/data
      - ./db/create_schema.sql:/docker-entrypoint-initdb.d/init.sql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  lab-minio-db:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - ${LAB_MINIO_CONSOLE_PORT:-9001}:9001
    environment:
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_USER}
    volumes:
      - lab_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  seed:
    image: cr.yandex/crp72ttqt6p7du7uvurg/audio-seeker-backend:lab2
    command: ["python", "-m", "back.scripts.seed"]
    restart: "no"
    profiles: ["seed"]
    environment:
      - PG_HOST=lab-pg-db
      - MINIO_HOST=lab-minio-db
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_PORT=9000
      - MINIO_API_PORT=9000
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - POSTGRES_PORT=5432
      - PG_DB=${PG_DB}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      - lab-pg-db
      - lab-minio-db

  backend:
    image: cr.yandex/crp72ttqt6p7du7uvurg/audio-seeker-backend:lab2
    restart: always
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      - PG_HOST=lab-pg-db
      - MINIO_HOST=lab-minio-db
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_PORT=9000
      - MINIO_API_PORT=9000
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - POSTGRES_PORT=5432
      - PG_DB=${PG_DB}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      - lab-pg-db
      - lab-minio-db

  frontend:
    image: cr.yandex/crp72ttqt6p7du7uvurg/audio-seeker-frontend:lab2
    restart: always
    ports:
      - ${FRONTEND_PORT:-80}:80
    depends_on:
      - backend

volumes:
  lab_pg_data:
  lab_minio_data: