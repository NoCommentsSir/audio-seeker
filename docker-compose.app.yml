version: '3.8'

services:
  lab-pg-db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DB}
    volumes:
      - lab_pg_data:/var/lib/postgresql/data
      - ./db/create_schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - ${LAB_POSTGRES_PORT:-15432}:5432
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  lab-minio-db:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - ${LAB_MINIO_API_PORT:-19000}:9000
      - ${LAB_MINIO_CONSOLE_PORT:-19001}:9001
    environment:
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_USER}
    volumes:
      - lab_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  seed:
    image: audio-seeker-backend:local
    command: ["python", "-m", "back.scripts.seed"]
    restart: "no"
    profiles: ["seed"]
    environment:
      - PG_HOST=lab-pg-db
      - MINIO_HOST=lab-minio-db
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_PORT=9000
      - MINIO_API_PORT=9000
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - POSTGRES_PORT=5432
      - PG_DB=${PG_DB}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - lab-pg-db
      - lab-minio-db

  backend:
    image: audio-seeker-backend:local
    restart: always
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      - PG_HOST=lab-pg-db
      - MINIO_HOST=lab-minio-db
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_PORT=9000
      - MINIO_API_PORT=9000
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - POSTGRES_PORT=5432
      - PG_DB=${PG_DB}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}

    depends_on:
      - lab-pg-db
      - lab-minio-db

  frontend:
    image: audio-seeker-frontend:local
    restart: always
    ports:
      - ${FRONTEND_PORT:-3000}:80
    depends_on:
      - backend
  
  sonar-qube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - 9500:9000
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

volumes:
  lab_pg_data:
  lab_minio_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp: