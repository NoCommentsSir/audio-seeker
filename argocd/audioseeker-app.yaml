apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audioseeker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/NoCommentsSir/audio-seeker
    targetRevision: main
    path: k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: audioseeker

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true